openapi: 3.1.0
info:
  title: Puffin API
  version: 0.1.0
servers:
  - url: /api

# telemetry is NOT http - it streams on ws://.../ws/telemetry, one
# TelemetrySample per frame (schema at the bottom)

paths:
  /auth/signup:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /settings:
    get:
      responses:
        "200":
          description: Current user settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettings"
      responses:
        "200":
          description: Updated user settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"

  /health:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /sim/status:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimStatus"

  /sim/start:
    post:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"

  /sim/stop:
    post:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"

  /sim/reset:
    post:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"

  # single-vehicle sim: selecting a model REPLACES the flying one. the api
  # writes the airframe env px4 boots with, restarts px4 and drops the old
  # gz entity - seconds of work, so the ack is fire-and-report
  /sim/vehicle:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleReplaceRequest"
      responses:
        "202":
          description: Replace sequence run; detail narrates each step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"

  /sim/vehicle/pose:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehiclePoseRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"

  /procs:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessInfo"

  /vehicle/arm:
    post:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"

  /vehicle/disarm:
    post:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"

  /vehicle/takeoff:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeoffRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"

  /vehicle/land:
    post:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"

  /ros/services:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosService"

  /ros/graph:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosGraph"

  /ros/lifecycle/{nodeName}:
    get:
      parameters:
        - name: nodeName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleState"

  /ros/lifecycle/{nodeName}/transition:
    post:
      parameters:
        - name: nodeName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"

  # missions latch onto a transient-local ros topic; the mission_node
  # lifecycle node flies the latest latched plan when activated. abort =
  # deactivate the node via the lifecycle endpoint - no extra verb here.
  /mission:
    get:
      responses:
        "200":
          description: Progress of the latched/flying mission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionStatus"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionRequest"
      responses:
        "202":
          description: Mission latched for the executor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"

  # the forge turns a plan into a real standalone package: the api drops a
  # spec into the /dev/shm dir it shares with the sim container, a watcher
  # there renders the template, colcon-builds it live, registers a
  # supervisord program under the plan's name, and copies the package into
  # sim/packages/ so the next image build bakes it in
  /mission/forge:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionRequest"
      responses:
        "202":
          description: Spec queued for the sim-side forge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"

  /mission/forge/{name}:
    get:
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Build progress for that node name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgeStatus"

components:
  schemas:
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    UserSettings:
      type: object
      required:
        [
          units,
          telemetry_history_limit,
          ws_url,
          api_base_url,
          terminal_x,
          terminal_y,
          terminal_minimized,
        ]
      properties:
        units:
          type: string
          enum: [metric, imperial]
        telemetry_history_limit:
          type: integer
          minimum: 10
          maximum: 5000
        ws_url:
          type: string
        api_base_url:
          type: string
        # floating terminal layout - css px offset from its default anchor
        terminal_x:
          type: number
        terminal_y:
          type: number
        terminal_minimized:
          type: boolean

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    Ack:
      type: object
      required: [ok, detail]
      properties:
        ok:
          type: boolean
        detail:
          type: string

    Waypoint:
      # ned meters, matching the setpoints px4 flies: x north, y east,
      # z down (5 m altitude = -5.0)
      type: object
      required: [x, y, z]
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
        hold_s:
          # loiter at this waypoint before moving on
          type: number
          default: 0

    MissionRequest:
      type: object
      required: [waypoints]
      properties:
        name:
          # ros node name for this mission's executor; priming an existing
          # name rebuilds that node with the new plan
          type: string
          pattern: "^[a-z][a-z0-9_]{0,30}$"
          default: mission
        waypoints:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/Waypoint"
        rate_hz:
          # setpoint stream rate; offboard needs >= 2 hz
          type: number
          minimum: 2
          maximum: 100
          default: 20
        takeoff_z:
          # ned down - the climb-out altitude before the first waypoint
          type: number
          default: -3.0
        return_to_origin:
          type: boolean
          default: true

    ForgeStatus:
      type: object
      required: [name, state, detail]
      properties:
        name:
          type: string
        state:
          type: string
          enum: [unknown, queued, building, done, failed]
        detail:
          type: string

    MissionStatus:
      type: object
      required: [state, total]
      properties:
        node:
          # which mission executor reported this; absent until one exists
          type: string
        state:
          type: string
          enum: [idle, ready, flying, holding, returning, done, aborted]
        current_index:
          # waypoint being flown; null unless flying/holding
          type: [integer, "null"]
        total:
          type: integer
        detail:
          type: string

    ProcessInfo:
      type: object
      required: [name, state, uptime_s]
      properties:
        name:
          type: string
        state:
          type: string
          enum: [STOPPED, STARTING, RUNNING, BACKOFF, STOPPING, EXITED, FATAL, UNKNOWN]
        uptime_s:
          type: integer

    SimStatus:
      type: object
      required: [running, world, processes]
      properties:
        running:
          type: boolean
        world:
          type: string
        # gz model px4 is booted with; absent only from an api that predates
        # /sim/vehicle. defaults to the image's x500
        vehicle:
          type: string
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessInfo"

    VehicleReplaceRequest:
      type: object
      required: [model]
      properties:
        # gz model name. the api holds the model -> SYS_AUTOSTART map for the
        # airframes baked into the image and 422s anything else
        model:
          type: string

    TakeoffRequest:
      type: object
      required: [altitude_m]
      properties:
        altitude_m:
          # meters up. api converts to NED (z negative)
          type: number
          minimum: 1
          maximum: 50

    VehiclePoseRequest:
      # gz set_pose teleport, world frame (z is meters UP, not NED). the api
      # refuses this while the vehicle is armed - move a flying drone with
      # offboard setpoints, not teleports
      type: object
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
          minimum: 0
          default: 0.3
        yaw_deg:
          type: number
          default: 0

    RosService:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string

    RosTopic:
      # publishers/subscribers are fully-qualified node names - the edges the
      # ros-graph screen draws, rqt style (node -> topic -> node)
      type: object
      required: [name, type, publishers, subscribers]
      properties:
        name:
          type: string
        type:
          type: string
        publishers:
          type: array
          items:
            type: string
        subscribers:
          type: array
          items:
            type: string

    RosGraph:
      type: object
      required: [nodes, topics]
      properties:
        nodes:
          type: array
          items:
            type: string
        topics:
          type: array
          items:
            $ref: "#/components/schemas/RosTopic"

    LifecycleState:
      type: object
      required: [node, state]
      properties:
        node:
          type: string
        state:
          type: string
          enum: [unconfigured, inactive, active, finalized, unknown]

    TransitionRequest:
      type: object
      required: [transition]
      properties:
        transition:
          type: string
          enum: [configure, activate, deactivate, cleanup, shutdown]

    TelemetrySample:
      # ws frame. t_us = px4 clock in microseconds, ned z is negative up
      type: object
      required: [t_us, armed, mode, ned, battery_v, attitude_q]
      properties:
        t_us:
          type: integer
        armed:
          type: boolean
        mode:
          type: string
        # px4 vehicle attitude quaternion [w, x, y, z], body FRD -> NED;
        # identity until the first attitude sample arrives
        attitude_q:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
        ned:
          type: object
          required: [x, y, z]
          properties:
            x:
              type: number
            y:
              type: number
            z:
              type: number
        battery_v:
          type: number
