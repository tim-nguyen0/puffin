; railway-only programs layered onto the sim image's supervisord tree.

[program:api]
command = bash -c "source /opt/ros/jazzy/setup.bash && source /ros_ws/install/setup.bash && uvicorn puffin_api.main:app --host 127.0.0.1 --port 8000"
priority = 50
autostart = true
autorestart = true

[program:nginx]
command = nginx -g "daemon off;"
priority = 55
autostart = true
autorestart = true

; qgc display stack, mirroring services/qgc: display :2, vnc 5901, novnc
; 6081 behind nginx's /qgc/ proxy. runs as ubuntu - qgc refuses root.
[program:xvfb-qgc]
command = Xvfb :2 -screen 0 1280x720x24 -nolisten tcp
user = ubuntu
priority = 11
autostart = true
autorestart = true

[program:qgc]
command = /opt/qgc/squashfs-root/AppRun
user = ubuntu
priority = 44
autostart = true
autorestart = true
environment = DISPLAY=":2",QT_QUICK_BACKEND="software",HOME="/home/ubuntu"

[program:x11vnc-qgc]
command = x11vnc -display :2 -forever -shared -nopw -quiet -rfbport 5901 -wait 5 -defer 5 -nowf
user = ubuntu
priority = 16
autostart = true
autorestart = true

[program:novnc-qgc]
command = /usr/share/novnc/utils/novnc_proxy --listen 6081 --vnc 127.0.0.1:5901
user = ubuntu
priority = 21
autostart = true
autorestart = true
