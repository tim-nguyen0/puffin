; qgc sidecar process tree: one display, one app, one stream. display :2 and
; ports 5901/6081 are the slots the sim container reserves for this sidecar
; in the shared network namespace. everything runs as the stock ubuntu user:
; qgc refuses to start as root.

[program:xvfb]
command = Xvfb :2 -screen 0 1280x720x24 -nolisten tcp
user = ubuntu
priority = 10
autostart = true
autorestart = true

[program:qgc]
; software scene graph: no gpu in the container, and under rosetta the
; qt quick default backend is the first thing to give up.
command = /opt/qgc/squashfs-root/AppRun
user = ubuntu
priority = 20
autostart = true
autorestart = true
environment = DISPLAY=":2",QT_QUICK_BACKEND="software",HOME="/home/ubuntu"

[program:x11vnc]
command = x11vnc -display :2 -forever -shared -nopw -quiet -rfbport 5901 -wait 5 -defer 5 -nowf
user = ubuntu
priority = 30
autostart = true
autorestart = true

[program:novnc]
command = /usr/share/novnc/utils/novnc_proxy --listen 6081 --vnc 127.0.0.1:5901
user = ubuntu
priority = 40
autostart = true
autorestart = true
