; Puffin sim process tree. gz-server (physics, authoritative) and gz-gui
; (viewport, disposable) are separate programs ON PURPOSE — never merge them.
; Commands are placeholders until the Dockerfile installs the real stack;
; autostart stays off until each program's binary exists in the image.

[inet_http_server]
port = 127.0.0.1:9001

[supervisorctl]
serverurl = http://127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:gz-server]
command = gz sim -s -r /worlds/puffin.sdf
autostart = false
autorestart = true

[program:gz-gui]
command = gz sim -g
autostart = false
autorestart = true
environment = DISPLAY=":1"

[program:xrce-agent]
command = MicroXRCEAgent udp4 -p 8888
autostart = false
autorestart = true

[program:px4]
command = /px4/build/px4_sitl_default/bin/px4
autostart = false
autorestart = true
environment = PX4_GZ_STANDALONE="1",PX4_SYS_AUTOSTART="4001"

[program:novnc]
command = /usr/share/novnc/utils/novnc_proxy --listen 6080
autostart = false
autorestart = true
