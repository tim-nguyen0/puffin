; Puffin sim process tree. gz-server (physics, authoritative) and gz-gui
; (viewport, disposable) are separate programs ON PURPOSE — never merge them.
; Start order is by priority: X stack -> bridges/physics -> px4.

[inet_http_server]
port = 127.0.0.1:9001

[supervisorctl]
serverurl = http://127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; forged mission nodes drop their program block here (see forge_watcher).
; supervisord is launched with /etc/supervisor/supervisord.conf, whose own
; [include] already globs this dir - and supervisor does not recurse into
; included files - so this line only matters if someone runs supervisord
; against this file directly.
[include]
files = /etc/supervisor/conf.d/*.conf

; the gazebo viewport display, streamed on 6080. qgroundcontrol lives in
; its own amd64 sidecar container (services/qgc) sharing this netns and
; streams on 6081 - display :2 and ports 5901/6081 are reserved for it.
; 720p + fast x11vnc polling: the container renders with software GL
; (llvmpipe, no GPU), so fewer pixels is the main viewport fps lever.
[program:xvfb]
command = Xvfb :1 -screen 0 1280x720x24 -nolisten tcp
priority = 10
autostart = true
autorestart = true

[program:x11vnc]
command = x11vnc -display :1 -forever -shared -nopw -quiet -rfbport 5900 -wait 5 -defer 5 -nowf
priority = 15
autostart = true
autorestart = true

[program:novnc]
command = /usr/share/novnc/utils/novnc_proxy --listen 6080 --vnc 127.0.0.1:5900
priority = 20
autostart = true
autorestart = true

[program:xrce-agent]
command = MicroXRCEAgent udp4 -p 8888
priority = 25
autostart = true
autorestart = true

[program:gz-server]
command = gz sim -s -r /worlds/puffin.sdf
priority = 30
autostart = true
autorestart = true

[program:gz-gui]
; ogre (v1) renders much faster than ogre2 on software GL; the viewport is
; cosmetic — the headless server keeps ogre2 for sensor fidelity. the
; sized config pins the window to the 1280x720 screen so the stream is
; exactly 16:9.
command = gz sim -g --render-engine ogre --gui-config /gui_full.config
priority = 35
autostart = true
autorestart = true
environment = DISPLAY=":1"

[program:px4]
; -d: daemon mode, no interactive pxh console (supervisord provides no tty).
; directory: px4 resolves its ROMFS and writes eeprom/logs relative to cwd.
command = /px4/build/px4_sitl_default/bin/px4 -d
directory = /px4/build/px4_sitl_default
priority = 40
autostart = true
autorestart = true
environment = PX4_GZ_STANDALONE="1",PX4_SYS_AUTOSTART="4001"

[program:px4-sim-params]
; sets the param then parks forever: an EXITED one-shot would make
; `supervisorctl status` (make procs) exit non-zero on a healthy stack.
; docker's vm scheduler stutters the sim clock, which spikes the ekf yaw
; innovation and intermittently fails arming at the default 0.5 threshold.
; sitl-only relaxation — this container never targets hardware.
command = bash -c "until bin/px4-param set COM_ARM_EKF_YAW 1.0; do sleep 3; done && exec sleep infinity"
directory = /px4/build/px4_sitl_default
priority = 41
autostart = true
autorestart = true

[program:qgc-link]
; the mavlink streams qgroundcontrol connects to: one to the docker host for
; a desktop qgc, one on loopback for the qgc below. resident after setup,
; like px4-sim-params.
command = /qgc_link.sh
priority = 42
autostart = true
autorestart = true

[program:offboard-demo]
; lifecycle node; self-configures to inactive at boot and waits — the api
; drives activate/deactivate via /ros/lifecycle.
command = bash -c "source /ros_ws/install/setup.bash && ros2 run offboard_demo offboard_demo_node"
priority = 45
autostart = true
autorestart = true

[program:teleop]
; manual-flight lifecycle node; same activate/deactivate contract as
; offboard-demo, velocity setpoints from /puffin/teleop/cmd_vel.
command = bash -c "source /ros_ws/install/setup.bash && ros2 run offboard_demo teleop_node"
priority = 46
autostart = true
autorestart = true

[program:mission]
; mission host; plain node that builds one lifecycle executor per plan
; posted to /puffin/mission, named by the plan's `name` and configured to
; inactive on arrival — the api then drives activate/deactivate per node,
; same contract as offboard-demo. re-posting a name rebuilds that executor.
command = bash -c "source /ros_ws/install/setup.bash && ros2 run offboard_demo mission_node"
priority = 47
autostart = true
autorestart = true

; 48 is left free: forged nodes claim it, so they start after the host and
; before the watcher that wrote them.

[program:node-forge]
; watches /dev/shm/puffin/forge - one filesystem with the api container,
; which shares this one's ipc namespace - and turns each mission spec it
; finds into a built, supervised ros package.
command = bash -c "source /ros_ws/install/setup.bash && ros2 run offboard_demo forge_watcher"
priority = 49
autostart = true
autorestart = true
