; Puffin sim process tree. gz-server (physics, authoritative) and gz-gui
; (viewport, disposable) are separate programs ON PURPOSE — never merge them.
; Start order is by priority: X stack -> bridges/physics -> px4.

[inet_http_server]
port = 127.0.0.1:9001

[supervisorctl]
serverurl = http://127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command = Xvfb :1 -screen 0 1920x1080x24 -nolisten tcp
priority = 10
autostart = true
autorestart = true

[program:x11vnc]
command = x11vnc -display :1 -forever -shared -nopw -quiet -rfbport 5900
priority = 15
autostart = true
autorestart = true

[program:novnc]
command = /usr/share/novnc/utils/novnc_proxy --listen 6080 --vnc 127.0.0.1:5900
priority = 20
autostart = true
autorestart = true

[program:xrce-agent]
command = MicroXRCEAgent udp4 -p 8888
priority = 25
autostart = true
autorestart = true

[program:gz-server]
command = gz sim -s -r /worlds/puffin.sdf
priority = 30
autostart = true
autorestart = true

[program:gz-gui]
command = gz sim -g
priority = 35
autostart = true
autorestart = true
environment = DISPLAY=":1"

[program:px4]
; -d: daemon mode, no interactive pxh console (supervisord provides no tty).
; directory: px4 resolves its ROMFS and writes eeprom/logs relative to cwd.
command = /px4/build/px4_sitl_default/bin/px4 -d
directory = /px4/build/px4_sitl_default
priority = 40
autostart = true
autorestart = true
environment = PX4_GZ_STANDALONE="1",PX4_SYS_AUTOSTART="4001"
